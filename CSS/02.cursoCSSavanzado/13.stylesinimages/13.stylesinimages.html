<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso CSS</title>

  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <center>
    <h1>Estilos en Imágenes</h1>

    <!-- image1 - Luna -->
    <img src="images/luna.jpg" id="image1">
    <br><br>

    <!-- image2 - Lobo Responsive -->
    <img src="images/lobo.jpg" id="image2">
    <br><br>

    <!-- image3 - Lobo con box-shadow -->
    <div class="lobo">
      <img src="images/lobo.jpg" id="image3">
      <div class="texto">
        <p>Colmillo Blanco</p>
      </div>
    </div>
    <br><br>

    <!-- image4 - Lobo con opacity -->
    <div class="lobo1">
      <img src="images/lobo.jpg" id="image4">
      <div class="texto1">
        <p>Colmillo Blanco</p>
      </div>
    </div>
    <br><br>

    <!-- image5 - Lobo con texto centrado -->
    <div class="lobo2">
      <img src="images/lobo.jpg" id="image5">
      <div class="texto_lobo">
        Lobo
      </div>
      <div class="texto2">
        <p>Colmillo Blanco</p>
      </div>
    </div>
    <br><br>

    <!-- image6 - Lobo con texto centrado y con transición -->
    <div class="lobo3">
      <img src="images/lobo.jpg" class="imagen">
      <div class=" texto_lobo1">
        <div class="efect_text">Lobo</div>
      </div>
      <div class="texto3">
        <p>Colmillo Blanco</p>
      </div>
    </div>
  </center>
</body>

</html>
