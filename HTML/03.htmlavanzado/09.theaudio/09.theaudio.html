<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso HTML</title>
  <link rel="stylesheet" href="estilos-audio.css">
</head>

<body>
  <h1>Audio</h1>
  <!-- Audio Estandar -->
  <h2>Audio Estandar</h2>
  <audio controls>
    <source src="audio/Piano-Rock.mp3">
  </audio>
  <br><br>

  <!-- Audio Personalizado -->
  <h2>Audio Personalizado</h2>
  <div class="audio">
    <audio id="player" src="audio/Piano-Rock.mp3"></audio>
    <button onclick="document.getElementById('player').play()">></button>
    <button onclick="document.getElementById('player').pause()">ll</button>
    <button onclick="document.getElementById('player').volume+=0.1">+</button>
    <button onclick="document.getElementById('player').volume-=0.1">-</button>
  </div>

</body>

</html>
