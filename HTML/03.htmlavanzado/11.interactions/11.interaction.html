<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso HTML</title>

  <style>
    /* Drag and Drop con Imagen */
    #caja {
      width: 360px;
      height: 240px;
      padding: 20px;
      margin: 20px;
      border: 3px solid red;
    }

    /* Drag and Drop con cajas */
    h1 {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      text-align: center;
      font-size: 45px;
      margin: 20px;
    }

    #contenedor {
      margin: 20px;
      float: left;
      width: 80%;
      height: 180px;
      border: 4px solid blue;
    }

    #caja1,
    #caja2,
    #caja3 {
      float: left;
      margin: 5px;
      padding: 10px;
    }

    #caja1 {
      width: 30px;
      height: 30px;
      background-color: rgb(151, 147, 147);
    }

    #caja2 {
      width: 60px;
      height: 60px;
      background-color: green;
    }

    #caja3 {
      width: 90px;
      height: 90px;
      background-color: red;
    }
  </style>

  <script>
    // Drag and Drop con Imagen
    function activar_drop(evt) {
      evt.preventDefault();

    }

    function drag(evt) {
      evt.dataTransfer.setData("Text", evt.target.id);
    }

    function drop(evt) {
      evt.preventDefault();
      var dato = evt.dataTransfer.getData("Text");
      evt.target.appendChild(document.getElementById(dato));
    }

    // Drag and Drop con cajas
    function activar_drop(evt) {
      evt.preventDefault();

    }

    function drag(evt) {
      evt.dataTransfer.setData("Text", evt.target.id);
    }

    function drop(evt) {
      evt.preventDefault();
      var dato = evt.dataTransfer.getData("Text");
      evt.target.appendChild(document.getElementById(dato));
    }

  </script>
</head>

<body>
  <h1>Drag and Drop</h1>

  <!-- Drag and Drop con Imagen -->
  <h2>Ejercicio 1</h2>
  <div id="caja" ondrop="drop(event)" ondragover="activar_drop(event)"></div>
  <img id="foto" src="images/1html.jpg" arrastrar="true" ondragstart="drag(event)" soltar="soltar" width="360"
    height="240">

  <!-- Drag and Drop con Imagen -->
  <h2>Ejercicio 2</h2>
  <div id="contenedor">
    <div id="caja1" draggable="true" ondragstart="drag(event)"></div>
    <div id="caja2" draggable="true" ondragstart="drag(event)"></div>
    <div id="caja3" ondrop="drop(event)" ondragover="activar_drop(event)"></div>
  </div>

</body>

</html>
